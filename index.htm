<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fde3ee">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ኡሙ ሀፍሷ ሚኒ ማርኬት</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;800&family=Noto+Serif+Ethiopic:wght@600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style id="pg"></style>
<style>
:root{
  color-scheme:light;
  --bg:#fff4f9; --card:#ffffff; --ink:#3b1a2e; --muted:#85586f;
  --line:#f1cbdd; --accent:#b0336f; --accent-ink:#ffffff; --err:#c0392b; --ok:#1f7a4d; --soft:#fde6f0;
  --t1:#8a2358; --t2:#d4a24c; --plum:#6d1a46;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;overflow-x:hidden}
body{font-family:"Noto Sans Ethiopic",system-ui,sans-serif;background:linear-gradient(160deg,#ffe1ee 0%,#fff8fb 45%,#fbd3e5 100%) fixed,var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;
  padding:max(14px,calc(env(safe-area-inset-top) + 8px)) max(14px,env(safe-area-inset-right)) calc(74px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  font-size:16px;-webkit-text-size-adjust:100%}
@media (min-width:900px){body{font-size:17px}}
.wrap{width:100%;max-width:1100px;margin:0 auto;min-width:0}
.top,.panel,form.fm{max-width:100%}

/* ቋንቋ */
.lang.fix{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:50}
.lang{display:flex;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;overflow:hidden;font:inherit;cursor:pointer;padding:0;min-height:40px}
.lang span{padding:8px 12px;font-weight:600;font-size:.9rem;color:var(--muted)}
.lang span.on{background:var(--accent);color:var(--accent-ink);font-weight:800}

/* መግቢያ */
.screen{min-height:calc(100dvh - 120px);display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(176,51,111,.14);padding:26px 22px;display:grid;gap:16px}
.card form{display:grid;gap:14px}
.card h1{margin:0;text-align:center}
.card p{margin:0;color:var(--muted);text-align:center;font-size:.95rem}
.pw{position:relative}
.pw input{padding-right:84px}
.pw button{position:absolute;right:4px;top:4px;bottom:4px;min-width:72px;border:0;border-radius:8px;background:var(--soft);color:var(--ink);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lk{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:6px 2px;min-height:40px;text-decoration:underline}
.card h1{font-size:1.9rem;font-weight:800;line-height:1.25;background:linear-gradient(90deg,var(--t1),var(--t2));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;display:inline-block}
.card h1::after{content:"";display:block;width:56px;height:3px;margin:6px auto 0;border-radius:3px;background:linear-gradient(90deg,var(--t1),var(--t2))}

/* ሎጎ እና ራስጌ */
.logo{background:var(--logo) center/contain no-repeat;flex:0 0 auto;filter:drop-shadow(0 4px 10px rgba(109,26,70,.35))}
.top{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"logo wel act";align-items:center;gap:14px;width:95%;margin:0 auto 14px;padding:14px 18px;
  background:linear-gradient(135deg,#fff0f7,#f6bcd8);border:1.5px solid #e79ac0;border-radius:18px;box-shadow:0 8px 26px rgba(176,51,111,.24)}
.top .logo{grid-area:logo;width:104px;height:104px}
.welcome{grid-area:wel;text-align:center;min-width:0}
.welcome .wl{font-family:"Noto Serif Ethiopic","Noto Sans Ethiopic",serif;font-weight:800;font-size:clamp(1.1rem,2.6vw,1.9rem);line-height:1.35;margin:0;
  background:linear-gradient(90deg,#6d1a46,#b0336f 50%,#d4a24c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;display:inline-block}
.act{grid-area:act;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.act .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.act #who{margin:0;color:var(--muted);font-size:.8rem;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.out{font:inherit;font-weight:600;min-height:44px;padding:0 16px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;cursor:pointer;white-space:nowrap}
.out:hover{border-color:var(--accent)}
.out.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800}
@media (max-width:700px){
  .top{grid-template-columns:auto 1fr;grid-template-areas:"logo act" "wel wel";padding:10px 12px}
  .top .logo{width:80px;height:80px}
  .act{align-items:flex-end}
}
.lgwrap{display:grid;justify-items:center;gap:14px;width:100%}
.lgwrap .logo{width:170px;height:170px}

/* መነሻ ገጽ: እንኳን ደህና መጡ + ዲጂታል ሰዓት */
.hero{display:grid;justify-items:center;gap:20px;padding:14px 4px 6px;text-align:center}
.wl2{margin:0;font-family:"Noto Serif Ethiopic","Noto Sans Ethiopic",serif;font-weight:800;font-size:clamp(1.3rem,4.2vw,2.3rem);line-height:1.4;max-width:900px;
  background:linear-gradient(90deg,#6d1a46,#b0336f 45%,#d4a24c 75%,#b0336f);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:flow 7s linear infinite}
@keyframes flow{to{background-position:200% center}}
.clock{position:relative;overflow:hidden;width:min(680px,100%);padding:24px 22px 20px;border-radius:28px;text-align:center;
  background:radial-gradient(circle at 20% 0%,#a02b66 0,#5a1639 60%,#3d0e27 100%);
  box-shadow:0 0 0 2px #e9c46a inset,0 0 0 7px rgba(233,196,106,.18) inset,0 22px 50px rgba(109,26,70,.45),0 0 46px rgba(233,196,106,.28)}
.clock::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);animation:shine 5s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.ctime{position:relative;font-family:"Orbitron","Noto Sans Ethiopic",monospace;font-weight:900;font-size:clamp(2.2rem,10vw,4.9rem);letter-spacing:2px;line-height:1.1;
  background:linear-gradient(90deg,#fff1c1,#ffd27a,#ffc2da,#fff1c1);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:flow 6s linear infinite;filter:drop-shadow(0 0 12px rgba(255,205,120,.55))}
.ctime i{font-style:normal;animation:blink 1s steps(2,start) infinite;padding:0 .04em}
@keyframes blink{50%{opacity:.25}}
.ctime em{font-style:normal;font-size:.32em;margin-left:.5em;letter-spacing:1px;vertical-align:.9em}
.cdate{position:relative;margin-top:8px;color:#ffe3ef;font-weight:600;font-size:clamp(.9rem,2.6vw,1.15rem);letter-spacing:.4px}
.cdate::before,.cdate::after{content:"✦";color:#e9c46a;margin:0 10px}

/* footer (ሁልጊዜ ከታች) */
.ftr{position:fixed;left:0;right:0;bottom:0;z-index:40;text-align:center;color:#ffe9f3;font-size:.88rem;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(135deg,#6d1a46,#b0336f);border-top:3px solid #d4a24c;box-shadow:0 -6px 20px rgba(109,26,70,.25)}

/* ገጽ አቀማመጥ */
.layout{display:grid;gap:14px;align-items:start}
.main{min-width:0}
.pgtitle{margin:0 0 12px;font-size:1.5rem;font-weight:800;background:linear-gradient(90deg,var(--t1),var(--t2));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;display:inline-block}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tabs button{flex:1 1 auto;min-width:84px;font:inherit;font-weight:600;font-size:.9rem;min-height:44px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer;padding:4px 8px}
.tabs button[aria-selected=true]{background:var(--soft);color:var(--ink);border-color:var(--accent);font-weight:800}
.side{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.side button{flex:0 0 auto;display:flex;align-items:center;gap:10px;font:inherit;font-weight:600;min-height:50px;padding:0 16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;cursor:pointer;white-space:nowrap}
.side button .ic{font-size:1.25rem}
.side button[aria-current=page]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800}
@media (min-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .main{order:2}
  .side{order:1;width:100%;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;gap:8px;box-shadow:0 4px 16px rgba(176,51,111,.08)}
  .side button{flex:1 1 0;min-width:0;justify-content:center;border-color:transparent;background:transparent}
  .side button[aria-current=page]{background:var(--accent)}
}
@media (max-width:899px){.side{order:-1}}
form.fm,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 16px rgba(176,51,111,.08)}
@media (min-width:600px){form.fm,.panel{padding:22px}}
form.fm{display:grid;gap:16px}
label{display:block;font-weight:600;margin-bottom:6px;font-size:.95rem}
label small{font-weight:400;color:var(--muted)}
select,input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
select option{color:#000}
input[readonly]{opacity:.75}
textarea{min-height:84px;resize:vertical}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.row2{display:grid;gap:16px}
@media (min-width:600px){.row2{grid-template-columns:1fr 1fr}}
.cat{border-top:2px solid var(--accent);padding-top:16px}
.opt{display:grid;gap:14px;padding:14px;border:1.5px dashed var(--line);border-radius:12px;background:var(--soft)}
.submit{background:linear-gradient(135deg,#8a2358,#c4457f);color:var(--accent-ink);border:0;border-radius:12px;font:inherit;font-weight:800;font-size:1.1rem;padding:14px;cursor:pointer;min-height:54px}
.submit[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.4em;font-weight:600;text-align:center}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
.ts,.uidline{font-size:.8rem;color:var(--muted);text-align:center}
.uidline{font-weight:600}
.chkrow{display:flex;align-items:center;gap:10px;font-weight:600}
.chkrow input{width:22px;height:22px;min-height:0;accent-color:var(--accent);padding:0}
.cal{position:relative}
.dbtn{width:100%;text-align:left;font:inherit;font-weight:600;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:48px;cursor:pointer}
.pop{position:absolute;left:0;top:calc(100% + 6px);z-index:20;width:min(320px,calc(100vw - 28px));background:var(--card);border:1.5px solid var(--accent);border-radius:12px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ph button{width:44px;height:44px;border:0;background:transparent;color:var(--ink);font-size:1.6rem;cursor:pointer;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.grid .wd{font-size:.72rem;color:var(--muted);padding:4px 0}
.grid button{height:40px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.grid button.sel{background:var(--accent);color:var(--accent-ink);font-weight:800}
.grid button.now{outline:1.5px solid var(--accent)}
.todaybtn{width:100%;margin-top:6px;min-height:40px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.items{display:grid;gap:8px}
@media (min-width:600px){.items{grid-template-columns:1fr 1fr}}
.items.one{grid-template-columns:1fr}
.it{display:grid;grid-template-columns:auto 1fr 84px;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-height:52px;margin:0}
.it.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.it input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:var(--accent);padding:0}
.it span{font-weight:600}
.it small{display:block;color:var(--muted);font-weight:400}
.it .q,.it .p{min-height:40px;padding:4px 6px;text-align:center;font-weight:800}
.it .q:disabled,.it .p:disabled{opacity:.35}
.it.buy{grid-template-columns:auto 1fr 74px 96px}
@media (max-width:520px){.it.buy{grid-template-columns:auto 1fr 1fr}.it.buy span{grid-column:2/4}.it.buy .q{grid-column:2}.it.buy .p{grid-column:3}}
.tbar{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--soft);border-radius:10px;font-weight:800}
.hint{color:var(--muted);font-size:.9rem;padding:6px 0}
.hint.err{color:var(--err)}

/* ሪፖርት */
.panel{margin:0}
.rh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.rh strong{font-size:1.05rem;line-height:1.35}
.rh button,.mini{font:inherit;font-weight:600;min-height:44px;padding:0 14px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;cursor:pointer;white-space:nowrap}
.rc{display:grid;gap:10px;margin-bottom:14px}
.ynav{display:flex;align-items:center;justify-content:center;gap:8px}
.ynav strong{min-width:150px;text-align:center}
.ynav button{width:46px;height:46px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font-size:1.4rem;cursor:pointer}
.weeks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.weeks button{font:inherit;font-weight:600;min-height:48px;padding:4px 12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer}
.weeks button small{display:block;font-weight:400;font-size:.72rem;color:inherit;opacity:.8}
.weeks button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sum div{background:var(--soft);border-radius:10px;padding:10px 12px}
.sum small{display:block;color:var(--muted);font-size:.8rem}
.sum b{font-size:1.3rem;font-weight:800}
.sum .gr b{color:var(--ok)} .sum .rd b{color:var(--err)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th.n,td.n{text-align:right}
thead th{background:var(--accent);color:var(--accent-ink)}
tfoot td{font-weight:800;background:var(--soft);border-bottom:0}
td.n{font-variant-numeric:tabular-nums}
td small{display:block;color:var(--muted);font-weight:400;font-size:.75rem}
td.neg{color:var(--err);font-weight:700}
.rk{width:34px;color:var(--muted);text-align:center!important}
.mt th,.mt td{padding:8px 7px;text-align:right}
.mt th{min-width:74px}
.mt th:first-child,.mt td:first-child{position:sticky;left:0;background:var(--card);z-index:1;border-right:1px solid var(--line);min-width:48px;text-align:center}
.mt thead th:first-child,.mt thead th:last-child{background:var(--accent);z-index:2}
.mt th:last-child,.mt td:last-child{position:sticky;right:0;background:var(--card);z-index:1;border-left:1px solid var(--line);font-weight:800}
.mt tfoot td:first-child,.mt tfoot td:last-child{background:var(--soft)}
.mt td.z{color:var(--muted);opacity:.5}
.mt td.l,.mt th.l{text-align:left;min-width:140px}
.gen{font-size:.78rem;color:var(--muted);text-align:center;margin:10px 0}
h3.sh{margin:6px 0 8px;font-size:1rem}
.pronly{display:none}
#pr{width:100%;margin-top:6px}
.perm td.c,.perm th.c{text-align:center}
.perm input{width:22px;height:22px;min-height:0;accent-color:var(--accent);padding:0}
.perm tr.grp td{background:var(--soft);font-weight:800}
.recbar{display:grid;gap:10px;margin-bottom:12px}
@media (min-width:600px){.recbar{grid-template-columns:1fr 1fr auto}}
.mrow{display:grid;gap:12px;margin-bottom:14px}
@media (min-width:640px){.mrow{grid-template-columns:1fr auto;align-items:end}}
.maddrow{display:grid;gap:10px;margin:0 0 14px;padding:14px;border:1.5px dashed var(--line);border-radius:12px;background:var(--soft)}
@media (min-width:640px){.maddrow{grid-template-columns:2fr 1fr auto;align-items:end}}
.maddrow .submit{min-height:48px;padding:0 20px;font-size:1rem}
.acts{display:flex;gap:6px}
.acts button{font:inherit;font-weight:600;min-height:38px;padding:0 10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;cursor:pointer}
.acts button.del{color:var(--err);border-color:var(--err)}
dialog{border:1.5px solid var(--accent);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;width:min(520px,calc(100vw - 24px));overflow:auto;max-height:92dvh}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{display:grid;gap:14px}
dialog .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog .btns .mini{min-height:50px}

@media print{
  :root{--bg:#fff;--card:#fff;--ink:#000;--line:#999;--muted:#444;--soft:#eee;--accent:#6d1a46;--accent-ink:#fff;--err:#b00}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{padding:0;font-size:12px;background:#fff}
  .layout{display:block}
  .noprint,.lang,.lgwrap .logo,.ftr{display:none!important}
  .panel{border:0;max-width:none;padding:0}
  .tw{overflow:visible;border:0}
  .pronly{display:block;text-align:center;font-size:1.4rem;font-weight:800;margin-bottom:6px}
  table{font-size:11px}
  .mt th:first-child,.mt td:first-child,.mt th:last-child,.mt td:last-child{position:static}

const ETH_EPOCH = 1723856;
function gregToEth(y, m, d) {
  const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
  const jdn = d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
  const r = (jdn - ETH_EPOCH) % 1461;
  const n = (r % 365) + 365 * Math.floor(r / 1460);
  return {y: 4 * Math.floor((jdn - ETH_EPOCH) / 1461) + Math.floor(r / 365) - Math.floor(r / 1460), m: Math.floor(n / 30) + 1, d: (n % 30) + 1};
}
const daysIn = (m, y) => m < 13 ? 30 : (y % 4 === 3 ? 6 : 5);
const weeksIn = (m, y) => Math.ceil(daysIn(m, y) / 7);
const weekday = (y, m, d) => (ETH_EPOCH + 365 * y + Math.floor(y / 4) + 30 * m + d - 31 + 1) % 7;
const n0 = new Date();
const TODAY = gregToEth(n0.getFullYear(), n0.getMonth() + 1, n0.getDate());
const ethText = o => o.d + " " + mName(o.m) + " " + o.y;
function parseEthTxt(s) {
  const p = String(s).trim().split(/\s+/);
  const m = E_AM.indexOf(p[1]) + 1;
  return (p.length >= 3 && m) ? {y: parseInt(p[2], 10), m: m, d: parseInt(p[0], 10)} : {...TODAY};
}

/* ===== የቀን መምረጫ ===== */
const CALS = [];
function makeCal(root, onChange, init) {
  const st = {sel: {...(init || TODAY)}};
  st.view = {y: st.sel.y, m: st.sel.m};
  root.className = "cal";
  root.innerHTML = '<button type="button" class="dbtn"></button><div class="pop" hidden role="dialog"><div class="ph"><button type="button" class="pm">‹</button><strong class="pt"></strong><button type="button" class="nm">›</button></div><div class="grid"></div><button type="button" class="todaybtn"></button></div>';
  const q = s => root.querySelector(s), pop = q(".pop");
  const label = () => { q(".dbtn").textContent = ethText(st.sel) + " " + t("ec"); q(".todaybtn").textContent = t("today"); };
  const pick = o => { st.sel = o; label(); pop.hidden = true; if (onChange) onChange({...o}); };
  function render() {
    q(".pt").textContent = mName(st.view.m) + " " + st.view.y;
    const g = q(".grid"); g.innerHTML = "";
    for (let i = 0; i < 7; i++) g.appendChild(el("div", WDN(i), "wd"));
    for (let i = 0; i < weekday(st.view.y, st.view.m, 1); i++) g.appendChild(document.createElement("div"));
    for (let d = 1; d <= daysIn(st.view.m, st.view.y); d++) {
      const b = el("button", d); b.type = "button";
      if (st.sel.y === st.view.y && st.sel.m === st.view.m && st.sel.d === d) b.classList.add("sel");
      if (TODAY.y === st.view.y && TODAY.m === st.view.m && TODAY.d === d) b.classList.add("now");
      b.onclick = () => pick({y: st.view.y, m: st.view.m, d});
      g.appendChild(b);
    }
  }
  const shiftv = k => { st.view.m += k; if (st.view.m > 13) { st.view.m = 1; st.view.y++; } if (st.view.m < 1) { st.view.m = 13; st.view.y--; } render(); };
  q(".pm").onclick = () => shiftv(-1);
  q(".nm").onclick = () => shiftv(1);
  q(".todaybtn").onclick = () => pick({...TODAY});
  q(".dbtn").onclick = () => { st.view = {y: st.sel.y, m: st.sel.m}; render(); pop.hidden = !pop.hidden; };
  const api = {root, get: () => ({...st.sel}), set(o) { st.sel = {...o}; label(); }, refresh() { label(); if (!pop.hidden) render(); }};
  CALS.push(api); label();
  return api;
}
document.addEventListener("click", e => {
  document.querySelectorAll(".cal .pop").forEach(p => { if (!p.parentElement.contains(e.target)) p.hidden = true; });
});

/* ===== ሁኔታ ===== */
let AUTH = null, MENU = [], SELLERS = [], ROLES = [], SEC = "", SUB = "", REQ = 0;
const RC = {date: {...TODAY}, month: {y: TODAY.y, m: TODAY.m}, week: Math.ceil(TODAY.d / 7), year: TODAY.y};
try { AUTH = JSON.parse(localStorage.getItem("umh_auth") || "null"); } catch (_) {}
if (AUTH && !AUTH.kind) AUTH = null;
const setMsg = (id, text, c) => { $(id).textContent = text; $(id).className = "msg " + (c || ""); };

/* ===== ከሰርቨር ጋር መገናኛ ===== */
async function api(action, payload) {
  const body = JSON.stringify(Object.assign({action, token: AUTH ? AUTH.token : ""}, payload || {}));
  const r = await fetch(SCRIPT_URL, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body});
  const j = await r.json();
  if (!j.ok && j.error === "AUTH" && AUTH) { logout(t("e_AUTH")); throw new Error("AUTH"); }
  return j;
}
async function post(act, data, btnId, msgId, after) {
  $(btnId).disabled = true; setMsg(msgId, t("sending"));
  try {
    const j = await api(act, data);
    if (!j.ok) { setMsg(msgId, errText(j.error), "err"); return j; }
    setMsg(msgId, "✓ " + t("saved"), "ok");
    if (after) after(j);
    return j;
  } catch (err) {
    if (err.message !== "AUTH") setMsg(msgId, t("e_NET"), "err");
  } finally { $(btnId).disabled = false; }
}

/* ===== መግቢያ ===== */

}

$("ff").addEventListener("submit", async e => {

function showLogin(message) {

function showPublic() {

function logout(message) {
  clearTimeout(idleT);
  AUTH = null; MENU = []; SELLERS = []; SEC = ""; SUB = ""; REQ++;
  if ($("dlg").open) $("dlg").close();
  localStorage.removeItem("umh_auth"); localStorage.removeItem("umh_menu");
  if (typeof message === "string" && message) showLogin(message); else showPublic();

$("gologin").addEventListener("click", () => showLogin());
$("go_home").addEventListener("click", () => showPublic());

$("chpw").addEventListener("click", () => openChPass(false));

/* ===== ለ 1 ደቂቃ ምንም ካልተነካ በራሱ መውጣት ===== */
let idleT = null, lastAct = Date.now();
function armIdle() {
  lastAct = Date.now();
  clearTimeout(idleT);
  if (AUTH) idleT = setTimeout(() => { if (AUTH) logout(t("idle_out")); }, IDLE_MS);
}
["mousemove", "mousedown", "keydown", "touchstart", "touchmove", "scroll", "wheel", "click", "input"].forEach(ev =>
  document.addEventListener(ev, () => { if (AUTH) armIdle(); }, {passive: true, capture: true}));
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && AUTH && Date.now() - lastAct > IDLE_MS) logout(t("idle_out"));
});

/* ===== ዲጂታል ሰዓት ===== */
function tickClock() {
  const n = new Date(); let h = n.getHours(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  const p = x => String(x).padStart(2, "0");
  $("ck_h").textContent = p(h); $("ck_m").textContent = p(n.getMinutes()); $("ck_s").textContent = p(n.getSeconds()); $("ck_ap").textContent = ap;
  $("ck_d").textContent = WDF(n.getDay()) + " · " + n.toLocaleDateString("en-GB", {day: "numeric", month: "long", year: "numeric"});
}
setInterval(() => { if (!$("pub").hidden) tickClock(); }, 1000);

/* ===== ፈቃዶች እና አሰሳ ===== */
// [ክፍል, [[ንዑስ, የፈቃድ ቁልፍ, "f" = ፎርም]]]   "*" = Super Admin ብቻ
const SECS = [
  ["sales", [["rec", "sales_rec", "f"], ["daily", "sales_daily"], ["weekly", "sales_weekly"], ["monthly", "sales_monthly"]]],
  ["credit", [["rep", "credit"]]],
  ["stock", [["rec", "stock_rec", "f"], ["cur", "stock_cur"], ["daily", "stock_daily"], ["weekly", "stock_weekly"], ["monthly", "stock_monthly"], ["total", "stock_total"]]],
  ["opex", [["rec", "opex_rec", "f"], ["rep", "opex_rep"]]],
  ["summary", [["rep", "summary"]]],
  ["items", [["rec", "items"]]],
  ["records", [["rec", "records"]]],
  ["users", [["add", "*", "f"], ["list", "*"]]],
  ["settings", [["rec", "*"]]]
];
const PGROUPS = [["sales", ["sales_rec", "sales_daily", "sales_weekly", "sales_monthly"]], ["credit", ["credit"]],
  ["stock", ["stock_rec", "stock_cur", "stock_daily", "stock_weekly", "stock_monthly", "stock_total"]],
  ["opex", ["opex_rec", "opex_rep"]], ["summary", ["summary"]], ["items", ["items"]], ["records", ["records"]]];
const isSuper = () => !!AUTH && AUTH.kind === "super";
const can = (k, i) => isSuper() || !!(AUTH && AUTH.perms && AUTH.perms[k] && AUTH.perms[k][i]);
const allowed = (k, form) => k === "*" ? isSuper() : (form ? (can(k, 1) || can(k, 2)) : can(k, 0));
function perms() {
  const P = {};
  SECS.forEach(([s, subs]) => { const ok = subs.filter(x => allowed(x[1], x[2] === "f")).map(x => x[0]); if (ok.length) P[s] = ok; });
  return P;
}
const FORMS = {"sales/rec": "f", "stock/rec": "fs", "opex/rec": "fo", "users/add": "fu"};
const subLabel = (sec, sub) => (sec === "stock" && sub === "rec") ? t("s_rec_items") : (sec === "opex" && sub === "rec") ? t("c_reason") : t("s_" + sub);
const ICONS = {sales: "💰", credit: "📒", stock: "📦", opex: "🧾", summary: "📊", items: "🛍️", records: "✏️", users: "👤", settings: "⚙️"};

function buildNav() {
  const P = perms(), secs = Object.keys(P);
  $("pgt").textContent = t("pg_" + SEC);
  const sn = $("secs"); sn.innerHTML = ""; sn.hidden = secs.length < 2;
  secs.forEach(s => {
    const b = document.createElement("button"); b.type = "button";
    b.appendChild(el("span", ICONS[s], "ic")); b.appendChild(el("span", t("sec_" + s)));
    if (s === SEC) b.setAttribute("aria-current", "page");
    b.onclick = () => showView(s, P[s][0]);
    sn.appendChild(b);
  });
  const subs = P[SEC] || [];
  const bn = $("subs"); bn.innerHTML = ""; bn.hidden = subs.length < 2;
  subs.forEach(u => {
    const b = el("button", subLabel(SEC, u)); b.type = "button"; b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(u === SUB));
    b.onclick = () => showView(SEC, u);
    bn.appendChild(b);
  });
}
function enterApp() {
  $("login").hidden = true; $("app").hidden = false; $("pub").hidden = true; $("hdr").hidden = false;
  $("gologin").hidden = true; $("logout").hidden = false; $("who").hidden = false; $("chpw").hidden = false;
  $("who").textContent = (AUTH.name || AUTH.role) + " · " + AUTH.code;
  document.querySelectorAll(".uidline").forEach(x => { x.textContent = t("uid") + ": " + AUTH.code; });
  MENU = []; armIdle();
  const P = perms(), first = Object.keys(P)[0];
  if (!first) { $("pgt").textContent = ""; $("subs").hidden = true; $("secs").hidden = true; return; }
  showView(first, P[first][0]);
}
function showView(sec, sub) {
  if (!AUTH) return;
  const P = perms();
  if (!P[sec]) sec = Object.keys(P)[0];
  if (!sec) return;
  if (P[sec].indexOf(sub) < 0) sub = P[sec][0];
  SEC = sec; SUB = sub; REQ++;
  buildNav();
  const k = sec + "/" + sub, form = FORMS[k];
  ["f", "fs", "fo", "fu"].forEach(id => $(id).hidden = id !== form);
  $("ulist").hidden = k !== "users/list"; $("set").hidden = sec !== "settings";
  $("menuMgr").hidden = sec !== "items"; $("recs").hidden = sec !== "records";
  const isRep = k in KINDS;
  $("rep").hidden = !isRep;
  if (form === "f") { loadMenu(); loadSellers(); }
  else if (form === "fs") loadMenu();
  else if (form === "fu") loadUserForm();
  else if (k === "users/list") loadUsers();
  else if (sec === "settings") loadSettings();
  else if (sec === "items") loadMenuMgr();
  else if (sec === "records") loadRecs();
  else if (isRep) loadReport();
}

/* ===== ምናሌ እና ሽያጭ መመዝገብ ===== */
const fill = (sel, list, ph) => {
  sel.innerHTML = "";
  if (ph !== undefined) { const o = new Option(ph, ""); o.disabled = true; o.selected = true; sel.add(o); }
  list.forEach(v => sel.add(Array.isArray(v) ? new Option(v[1], v[0]) : new Option(v, v)));
};
const setPh = (id, key) => { const s = $(id); if (s.options.length && s.options[0].value === "") s.options[0].textContent = t(key); };

const calSales = makeCal($("c_sales")), calStock = makeCal($("c_stock")), calOpex = makeCal($("c_opex")), calDue = makeCal($("c_due"));
$("dueOn").addEventListener("change", () => { $("c_due").hidden = !$("dueOn").checked; });
function fillPay() {
  const kp = $("pay").value || "paid", km = $("method").value || "cash";
  fill($("pay"), [["paid", t("paid")], ["credit", t("credit")]]); $("pay").value = kp;
  fill($("method"), [["cash", t("cash")], ["account", t("account")]]); $("method").value = km;
  togglePay();
}
function togglePay() {
  const c = $("pay").value === "credit";
  $("paidbox").hidden = c; $("creditbox").hidden = !c;
}
$("pay").addEventListener("change", togglePay);

const sLabel = s => s.name + " (" + s.code + ")";
async function loadSellers() {
  try {
    const j = await api("sellers");
    if (!j.ok) return;
    SELLERS = j.sellers;
    const keep = $("seller").value, mine = SELLERS.filter(s => s.code === AUTH.code)[0];
    fill($("seller"), SELLERS.map(sLabel), t("choose"));
    $("seller").value = keep || (mine ? sLabel(mine) : "");
  } catch (_) {}
}
function fillCats() {
  const names = MENU.map(c => c.category);
  [["category", "sales"], ["st_cat", "stock"]].forEach(([id]) => { const keep = $(id).value; fill($(id), names, t("choose_cat")); if (keep && names.indexOf(keep) >= 0) $(id).value = keep; });
}
async function loadMenu() {
  fill($("category"), [], t("menu_loading")); fill($("st_cat"), [], t("menu_loading"));
  try {
    const cached = JSON.parse(localStorage.getItem("umh_menu") || "[]");
    if (cached.length) { MENU = cached; fillCats(); }
  } catch (_) {}
  try {
    const j = await api("menu");
    if (!j.ok) throw new Error(j.error);
    MENU = j.menu; localStorage.setItem("umh_menu", JSON.stringify(MENU)); fillCats();
  } catch (e) {
    if (!AUTH) return;
    if (!MENU.length) setMsg(SEC === "stock" ? "m_stock" : "msg", t("menu_fail"), "err");
    else fillCats();
  }
}
function renderItems(cat) {
  const box = $("items"); box.innerHTML = "";
  const c = MENU.find(x => x.category === cat);
  if (!c || !c.items.length) { box.appendChild(el("div", t("no_items"), "hint")); return; }
  c.items.forEach(({name, price}) => {
    const row = document.createElement("label"); row.className = "it";
    row.innerHTML = '<input type="checkbox"><span></span><input class="q" type="number" inputmode="numeric" min="1" step="1" value="1" disabled>';
    const sp = row.querySelector("span"); sp.textContent = name;
    if (price) sp.appendChild(el("small", fmt(price) + " " + t("birr")));
    row.dataset.name = name;
    const cb = row.querySelector("[type=checkbox]"), q = row.querySelector(".q");
    cb.addEventListener("change", () => { q.disabled = !cb.checked; row.classList.toggle("on", cb.checked); if (cb.checked) { q.focus(); q.select(); } });
    box.appendChild(row);
  });
}
$("category").addEventListener("change", e => renderItems(e.target.value));
const tick = () => $("ts").textContent = new Date().toLocaleString("en-GB");
tick(); setInterval(tick, 1000);

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  if (!AUTH) return;
  if (!$("seller").value) { setMsg("msg", t("pick_seller"), "err"); $("seller").focus(); return; }
  if (!$("category").value) { setMsg("msg", t("pick_category"), "err"); $("category").focus(); return; }
  const items = [];
  for (const row of document.querySelectorAll("#items .it")) {
    if (!row.querySelector("[type=checkbox]").checked) continue;
    const q = parseInt(row.querySelector(".q").value, 10);
    if (!q || q < 1) { setMsg("msg", row.dataset.name + ": " + t("qty_min"), "err"); row.querySelector(".q").focus(); return; }
    items.push({name: row.dataset.name, qty: q});
  }
  if (!items.length) { setMsg("msg", t("pick_one"), "err"); return; }
  const credit = $("pay").value === "credit";
  const data = {seller: $("seller").value, category: $("category").value, date: calSales.get(), note: $("note").value.trim(), items, pay: $("pay").value};
  if (credit) {
    const buyer = $("buyer").value.trim(), phone = $("phone").value.trim();
    if (!buyer || !phone) { setMsg("msg", t("e_BAD_BUYER"), "err"); return; }
    data.buyer = buyer; data.phone = phone;
    if ($("dueOn").checked) data.due = calDue.get();
  } else data.method = $("method").value;
  await post("submit", data, "send", "msg", () => {
    setMsg("msg", "✓ " + items.length + " " + t("items_saved"), "ok");
    $("category").selectedIndex = 0;
    $("items").innerHTML = ""; $("items").appendChild(el("div", t("choose_cat_first"), "hint"));
    $("note").value = ""; $("buyer").value = ""; $("phone").value = ""; $("dueOn").checked = false; $("c_due").hidden = true;
    $("pay").value = "paid"; togglePay();
  });
});

/* ===== ዕቃዎችን መመዝገብ (ግዥ) ===== */
function renderBuyItems(cat) {
  const box = $("st_items"); box.innerHTML = ""; calcBuy();
  const c = MENU.find(x => x.category === cat);
  if (!c || !c.items.length) { box.appendChild(el("div", t("no_items"), "hint")); return; }
  c.items.forEach(({name, price}) => {
    const row = document.createElement("label"); row.className = "it buy";
    row.innerHTML = '<input type="checkbox"><span></span><input class="q" type="number" inputmode="decimal" min="0" step="any" placeholder="#" disabled><input class="p" type="number" inputmode="decimal" min="0" step="any" disabled>';
    const sp = row.querySelector("span"); sp.textContent = name;
    const rt = el("small", ""); sp.appendChild(rt);
    row.dataset.name = name;
    const cb = row.querySelector("[type=checkbox]"), q = row.querySelector(".q"), p = row.querySelector(".p");
    const upd = () => { const a = parseFloat(q.value), b = parseFloat(p.value); rt.textContent = (a > 0 && b >= 0) ? "= " + fmt(a * b) + " " + t("birr") : ""; calcBuy(); };
    cb.addEventListener("change", () => {
      q.disabled = p.disabled = !cb.checked; row.classList.toggle("on", cb.checked);
      if (cb.checked) { if (!q.value) q.value = 1; if (!p.value) p.value = price || ""; q.focus(); q.select(); } else { q.value = ""; p.value = ""; }

    rep.rows.map((x, i) => [RK(i), x.item, N(x.bought), N(x.sold), {t: fmt(x.qty), c: x.qty < 0 ? "n neg" : "n"}, N(x.value)]),
    ["", t("sum"), "", "", "", N(rep.totalValue)]));
}
function renderTotal(box, rep) {
  box.appendChild(sumBox([[t("c_total_in"), fmt(rep.totalQty)], [t("c_spent"), fmt(rep.totalMoney)]]));
  if (!rep.rows.length) return none(box);
  box.appendChild(tbl([{t: t("c_no"), c: "rk"}, t("item_name"), {t: t("c_total_in"), c: "n"}, {t: t("c_spent"), c: "n"}],
    rep.rows.map((x, i) => [RK(i), x.item, N(x.qty), N(x.amount)]), ["", t("sum"), N(rep.totalQty), N(rep.totalMoney)]));
}
function renderOpex(box, rep) {
  box.appendChild(sumBox([[t("year_total"), fmt(rep.total)]]));
  if (!rep.rows.length) return none(box);
  const head = [t("c_no"), {t: t("c_reason"), c: "l"}].concat(Array.from({length: 13}, (_, i) => mName(i + 1)), [t("col_total")]);
  const rows = rep.rows.map((r, i) => [{t: i + 1}, {t: r.reason, s: t(r.type), c: "l"}].concat(r.months.map(v => ({t: v ? fmt(v) : "·", c: v ? "n" : "n z"})), [N(r.total)]));
  const foot = [{t: ""}, {t: t("sum"), c: "l"}].concat(rep.monthTotals.map(v => ({t: v ? fmt(v) : "·", c: "n"})), [N(rep.total)]);
  box.appendChild(tbl(head, rows, foot, "mt"));
}
function renderSummary(box, rep) {
  const T = rep.totals;
  box.appendChild(sumBox([[t("c_sales_t"), fmt(T.sales)], [t("c_diff"), fmt(T.diff)], [t("unpaid_amt"), fmt(T.unpaid), "rd"]]));
  const nd = v => ({t: fmt(v), c: v < 0 ? "n neg" : "n"});
  const rows = Array.from({length: 13}, (_, i) => [mName(i + 1), N(rep.sales[i]), {t: rep.unpaid[i] ? fmt(rep.unpaid[i]) : "·", c: "n"}, N(rep.purchase[i]), N(rep.opex[i]), nd(rep.diff[i])]);
  box.appendChild(tbl([t("c_month"), {t: t("c_sales_t"), c: "n"}, {t: t("unpaid"), c: "n"}, {t: t("c_purch"), c: "n"}, {t: t("c_opex"), c: "n"}, {t: t("c_diff"), c: "n"}],
    rows, [t("sum"), N(T.sales), N(T.unpaid), N(T.purchase), N(T.opex), nd(T.diff)]));
  box.appendChild(el("div", t("sum_formula"), "hint"));
}

/* ===== ማስተካከያ / መሰረዝ ===== */
const RECDEF = {
  sales: {cols: [[0, "c_time"], [2, "c_seller"], [3, "c_cat"], [4, "c_item"], [5, "c_qty"], [8, "c_price"], [6, "c_date"], [9, "c_totalb"], [10, "c_status"], [11, "c_method"], [12, "c_buyer"], [13, "c_phone"], [14, "due_date"], [7, "c_note"]],
    fields: [{k: "waiter", i: 2, ty: "wt", lb: "c_seller"}, {k: "category", i: 3, ty: "cat", lb: "c_cat"}, {k: "item", i: 4, ty: "item", lb: "c_item"},
      {k: "qty", i: 5, ty: "num", lb: "c_qty"}, {k: "price", i: 8, ty: "num", lb: "unit_price"}, {k: "date", i: 6, ty: "date", lb: "c_date"},
      {k: "status", i: 10, ty: "ps", lb: "pay_status"}, {k: "method", i: 11, ty: "pm", lb: "pay_method"}, {k: "buyer", i: 12, ty: "text", lb: "c_buyer"}, {k: "phone", i: 13, ty: "text", lb: "c_phone"}, {k: "note", i: 7, ty: "text", lb: "c_note"}]},
  stock: {cols: [[0, "c_time"], [1, "item_name"], [2, "c_cat"], [3, "qty"], [4, "unit_price"], [5, "total_price"], [6, "c_date"], [7, "c_by"]],
    fields: [{k: "name", i: 1, ty: "text", lb: "item_name"}, {k: "category", i: 2, ty: "text", lb: "c_cat"}, {k: "qty", i: 3, ty: "num", lb: "qty"}, {k: "price", i: 4, ty: "num", lb: "unit_price"}, {k: "date", i: 6, ty: "date", lb: "buy_date"}]},
  opex: {cols: [[1, "c_reason"], [2, "c_type"], [3, "c_amount"], [4, "c_date"]],
    fields: [{k: "reason", i: 1, ty: "text", lb: "c_reason"}, {k: "type", i: 2, ty: "ft", lb: "c_type"}, {k: "amount", i: 3, ty: "num", lb: "c_amount"}, {k: "date", i: 4, ty: "date", lb: "c_date"}]}
};
let RECROWS = [];
function fillRds() {
  const keep = $("rds").value || "sales";
  $("rds").innerHTML = "";
  Object.keys(RECDEF).forEach(k => $("rds").add(new Option(t("ds_" + k), k)));
  $("rds").value = keep;
}
$("rds").addEventListener("change", () => loadRecs());
$("rrefresh").addEventListener("click", () => loadRecs());
$("rfilter").addEventListener("input", () => renderRecs());
async function loadRecs() {
  if (!AUTH || !can("records", 0)) return;
  if (!$("rds").options.length) fillRds();
  setMsg("m_rec", t("loading"));
  const my = ++REQ;
  try {
    const j = await api("rec_list", {ds: $("rds").value});
    if (my !== REQ) return;
    if (!j.ok) { setMsg("m_rec", errText(j.error), "err"); return; }
    RECROWS = j.rows; setMsg("m_rec", ""); renderRecs();
  } catch (err) { if (err.message !== "AUTH") setMsg("m_rec", t("e_NET"), "err"); }
}
function renderRecs() {
  const ds = $("rds").value, def = RECDEF[ds], f = $("rfilter").value.trim().toLowerCase();
  const box = $("rlist"); box.innerHTML = "";
  const rows = RECROWS.filter(r => !f || r.v.join(" ").toLowerCase().indexOf(f) >= 0);
  if (!rows.length) { box.appendChild(el("div", t("none"), "hint")); return; }
  const w = el("div", null, "tw"), tb = document.createElement("table");
  const hr = tb.createTHead().insertRow();
  def.cols.forEach(c => hr.appendChild(el("th", t(c[1]))));
  hr.appendChild(el("th", t("actions")));
  const body = tb.createTBody();
  rows.forEach(r => {
    const tr = body.insertRow();
    def.cols.forEach(c => tr.appendChild(el("td", r.v[c[0]])));
    const td = el("td"), acts = el("div", null, "acts");
    if (can("records", 2)) { const eb = el("button", t("edit")); eb.type = "button"; eb.onclick = () => openEdit(ds, r); acts.appendChild(eb); }
    if (can("records", 3)) { const db = el("button", t("del"), "del"); db.type = "button"; db.onclick = () => delRec(ds, r); acts.appendChild(db); }
    td.appendChild(acts); tr.appendChild(td);
  });
  w.appendChild(tb); box.appendChild(w);
}
async function delRec(ds, r) {
  if (!confirm(t("confirm_del"))) return;
  setMsg("m_rec", t("sending"));
  try {
    const j = await api("rec_delete", {ds, row: r.row, sig: r.sig});
    if (!j.ok) { setMsg("m_rec", errText(j.error), "err"); if (j.error === "STALE") loadRecs(); return; }
    setMsg("m_rec", "✓", "ok"); loadRecs();
  } catch (err) { if (err.message !== "AUTH") setMsg("m_rec", t("e_NET"), "err"); }
}

/* ===== መገናኛ መስኮት (Dialog) ===== */
let EDIT = null, DLG_CB = null, DLG_DONE = null;
function openSimpleDialog(title, fields, cb, done) {
  EDIT = null; DLG_CB = cb; DLG_DONE = done || null;
  const box = $("dfields"); box.innerHTML = ""; $("dtitle").textContent = title; setMsg("dmsg", "");
  const ctl = [];
  fields.forEach(f => {
    const wr = el("div"); wr.appendChild(el("label", f.label));
    let i;
    if (f.type === "select") {
      i = document.createElement("select"); f.options.forEach(([v, l]) => i.add(new Option(l, v)));
    } else {
      i = document.createElement("input");
      if (f.type === "number") { i.type = "number"; i.step = "any"; i.min = "0"; i.inputMode = "decimal"; }
      if (f.type === "password") { i.type = "password"; i.autocomplete = "new-password"; }
    }
    i.value = f.value == null ? "" : f.value; wr.appendChild(i); box.appendChild(wr); ctl.push(i);
  });
  $("dlg").showModal(); ctl[0].focus();
}
async function openEdit(ds, r) {
  const def = RECDEF[ds];
  if (ds === "sales") { if (!MENU.length) await loadMenu(); if (!SELLERS.length) await loadSellers(); }
  const box = $("dfields"); box.innerHTML = "";
  $("dtitle").textContent = t("edit_title"); setMsg("dmsg", "");
  EDIT = {ds, r, ctl: {}}; DLG_CB = null; DLG_DONE = null;
  const S = {};
  const withCur = (list, cur) => (cur && list.indexOf(cur) < 0) ? [cur].concat(list) : list;
  const mkSel = (list, cur) => { const sl = document.createElement("select"); list.forEach(o => sl.add(new Option(o, o))); if (cur) sl.value = cur; return sl; };
  const itemNames = cat => { const c = MENU.find(x => x.category === cat); return c ? c.items.map(i => i.name) : []; };
  const fillItem = keep => { S.item.innerHTML = ""; withCur(itemNames(S.cat.value), keep).forEach(n => S.item.add(new Option(n, n))); if (keep) S.item.value = keep; };
  const priceFromMenu = () => {
    const c = MENU.find(x => x.category === S.cat.value), it = c && c.items.find(i => i.name === S.item.value);
    if (it && it.price && S.price) S.price.value = it.price;
  };
  def.fields.forEach(f => {
    const wrap = el("div"); wrap.appendChild(el("label", t(f.lb)));
    const cur = r.v[f.i];
    if (f.ty === "date") {
      const m = document.createElement("div"); wrap.appendChild(m);
      EDIT.ctl[f.k] = makeCal(m, null, parseEthTxt(cur));
    } else if (f.ty === "ft" || f.ty === "ps" || f.ty === "pm") {
      const sl = document.createElement("select");
      const opts = f.ty === "ft" ? [["fixed", "fixed"], ["temp", "temp"]] : f.ty === "ps" ? [["paid", "paid"], ["credit", "credit"]] : [["cash", "cash"], ["account", "account"]];
      opts.forEach(([v, k]) => sl.add(new Option(t(k), v)));
      sl.value = f.ty === "ft" ? (/^(ጊዜያዊ|temp)/i.test(cur) ? "temp" : "fixed") : f.ty === "ps" ? (/^(የዱቤ|credit)/i.test(cur) ? "credit" : "paid") : (/^(አካውንት|account)/i.test(cur) ? "account" : "cash");
      wrap.appendChild(sl); EDIT.ctl[f.k] = {get: () => sl.value};
    } else if (f.ty === "wt") {
      const sl = mkSel(withCur(SELLERS.map(sLabel), cur), cur); wrap.appendChild(sl); EDIT.ctl[f.k] = {get: () => sl.value};
    } else if (f.ty === "cat") {
      const sl = mkSel(withCur(MENU.map(c => c.category), cur), cur); S.cat = sl;
      sl.onchange = () => { fillItem(null); priceFromMenu(); };
      wrap.appendChild(sl); EDIT.ctl[f.k] = {get: () => sl.value};
    } else if (f.ty === "item") {
      S.item = document.createElement("select"); fillItem(cur);
      S.item.onchange = priceFromMenu;
      wrap.appendChild(S.item); EDIT.ctl[f.k] = {get: () => S.item.value};
    } else {
      const i = document.createElement("input");
      if (f.ty === "num") { i.type = "number"; i.step = "any"; i.min = "0"; i.inputMode = "decimal"; i.value = String(cur).replace(/,/g, ""); if (f.k === "price") S.price = i; } else i.value = cur;
      wrap.appendChild(i); EDIT.ctl[f.k] = {get: () => i.value};
    }
    box.appendChild(wrap);
  });
  $("dlg").showModal();
}
$("dcancel").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("close", () => { DLG_CB = null; });
$("dform").addEventListener("submit", async e => {
  e.preventDefault();
  if (DLG_CB) {
    const cb = DLG_CB, done = DLG_DONE, vals = Array.from($("dfields").querySelectorAll("input,select")).map(i => i.value.trim());
    $("dsave").disabled = true; setMsg("dmsg", t("sending"));
    try {
      const j = await cb(vals);
      if (!j.ok) { setMsg("dmsg", errText(j.error), "err"); if (j.error === "STALE") { $("dlg").close(); if (done) done(); } return; }
      $("dlg").close(); if (done) done();
    } catch (err) { if (err.message !== "AUTH") setMsg("dmsg", t("e_NET"), "err"); }
    finally { $("dsave").disabled = false; }
    return;
  }
  if (!EDIT) return;
  const edits = {};
  Object.keys(EDIT.ctl).forEach(k => { edits[k] = EDIT.ctl[k].get(); });
  $("dsave").disabled = true; setMsg("dmsg", t("sending"));
  try {
    const j = await api("rec_update", {ds: EDIT.ds, row: EDIT.r.row, sig: EDIT.r.sig, edits});
    if (!j.ok) { setMsg("dmsg", errText(j.error), "err"); if (j.error === "STALE") { $("dlg").close(); loadRecs(); } return; }
    $("dlg").close(); setMsg("m_rec", "✓ " + t("saved"), "ok"); loadRecs();
  } catch (err) { if (err.message !== "AUTH") setMsg("dmsg", t("e_NET"), "err"); }
  finally { $("dsave").disabled = false; }
});

/* ===== የእቃ ዝርዝር (Item List) ማስተካከያ ===== */
let MGR = [], MGRSEL = "";
function afterMenuChange() { MENU = []; localStorage.removeItem("umh_menu"); loadMenuMgr(true); }
async function loadMenuMgr(quiet) {
  if (!AUTH || !can("items", 0)) return;
  if (!quiet) setMsg("m_menu", t("loading"));
  const my = ++REQ;
  try {
    const j = await api("menu_full");
    if (my !== REQ) return;
    if (!j.ok) { setMsg("m_menu", errText(j.error), "err"); return; }
    MGR = j.menu; if (!quiet) setMsg("m_menu", ""); renderMenuMgr();
  } catch (err) { if (err.message !== "AUTH") setMsg("m_menu", t("e_NET"), "err"); }
}
const curCat = () => MGR[parseInt($("m_cat").value, 10)];
function renderMenuMgr() {
  const sel = $("m_cat"); sel.innerHTML = "";
  MGR.forEach((c, i) => sel.add(new Option(c.category, String(i))));
  const at = MGR.findIndex(c => c.category === MGRSEL);
  if (MGR.length) sel.value = String(at >= 0 ? at : 0);
  const cat = curCat(); if (cat) MGRSEL = cat.category;
  $("m_newcat").hidden = !can("items", 1); $("m_ren").hidden = !can("items", 2); document.querySelector(".maddrow").hidden = !can("items", 1);
  const box = $("mlist"); box.innerHTML = "";
  if (!cat) return;
  if (!cat.items.length) { box.appendChild(el("div", t("no_items"), "hint")); return; }
  const w = el("div", null, "tw"), tb = document.createElement("table");
  const hr = tb.createTHead().insertRow();
  [t("c_no"), t("c_item"), t("c_price"), t("actions")].forEach(x => hr.appendChild(el("th", x)));
  const body = tb.createTBody();
  cat.items.forEach((it, i) => {
    const tr = body.insertRow();
    tr.appendChild(el("td", i + 1, "rk")); tr.appendChild(el("td", it.name)); tr.appendChild(el("td", fmt(it.price), "n"));
    const td = el("td"), acts = el("div", null, "acts");
    if (can("items", 2)) { const eb = el("button", t("edit")); eb.type = "button"; eb.onclick = () => editMenuItem(it); acts.appendChild(eb); }
    if (can("items", 3)) { const db = el("button", t("del"), "del"); db.type = "button"; db.onclick = () => delMenuItem(it); acts.appendChild(db); }
    td.appendChild(acts); tr.appendChild(td);
  });
  w.appendChild(tb); box.appendChild(w);
}
function editMenuItem(it) {
  openSimpleDialog(t("m_edit_item"), [{label: t("c_item"), value: it.name}, {label: t("c_price"), value: it.price, type: "number"}],
    v => api("menu_update", {row: it.row, oldName: it.name, name: v[0], price: v[1]}), afterMenuChange);
}
async function delMenuItem(it) {
  if (!confirm(t("m_confirm_del"))) return;
  setMsg("m_menu", t("sending"));
  try {
    const j = await api("menu_delete", {row: it.row, oldName: it.name});
    if (!j.ok) { setMsg("m_menu", errText(j.error), "err"); if (j.error === "STALE") afterMenuChange(); return; }
    setMsg("m_menu", "✓", "ok"); afterMenuChange();
  } catch (err) { if (err.message !== "AUTH") setMsg("m_menu", t("e_NET"), "err"); }
}
$("m_cat").addEventListener("change", () => { const c = curCat(); if (c) MGRSEL = c.category; renderMenuMgr(); });
$("m_ref").addEventListener("click", () => loadMenuMgr());
$("m_ren").addEventListener("click", () => {
  const c = curCat(); if (!c) return;
  openSimpleDialog(t("m_rename_cat"), [{label: t("category"), value: c.category}], async v => {
    const j = await api("menu_cat_rename", {row: c.row, oldName: c.category, name: v[0]});
    if (j.ok) MGRSEL = v[0]; return j;
  }, afterMenuChange);
});
$("m_newcat").addEventListener("click", () => {
  openSimpleDialog(t("m_new_cat"), [{label: t("m_cat_name"), value: ""}], async v => {
    const j = await api("menu_cat_add", {name: v[0]});
    if (j.ok) MGRSEL = v[0]; return j;
  }, afterMenuChange);
});
$("m_add").addEventListener("click", async () => {
  const c = curCat(), name = $("m_name").value.trim(), price = parseFloat($("m_price").value);
  if (!c) return;
  if (!name) { setMsg("m_menu", t("e_BAD_NAME"), "err"); $("m_name").focus(); return; }
  if (!(price >= 0)) { setMsg("m_menu", t("e_BAD_AMOUNT"), "err"); $("m_price").focus(); return; }
  await post("menu_add", {category: c.category, catRow: c.row, name, price}, "m_add", "m_menu", () => {
    $("m_name").value = ""; $("m_price").value = ""; $("m_name").focus(); afterMenuChange();
  });
});

/* ===== footer እና ቋንቋ ===== */
function renderFooter() { $("ftr").textContent = "© " + new Date().getFullYear() + " Umu hafsua mini shop · All rights reserved."; }
function applyLang() {
  document.documentElement.lang = lang; document.title = t("app");
  document.querySelectorAll("[data-i]").forEach(n => { n.textContent = t(n.dataset.i); });
  document.querySelectorAll("[data-ph]").forEach(n => { n.placeholder = t(n.dataset.ph); });
  document.querySelectorAll(".lang span").forEach(s => s.classList.toggle("on", s.dataset.l === lang));
  $("lshow").textContent = $("lpass").type === "password" ? t("show") : t("hide");
  setPh("seller", "choose"); setPh("category", MENU.length ? "choose_cat" : "menu_loading"); setPh("st_cat", MENU.length ? "choose_cat" : "menu_loading"); setPh("u_role", "choose");
  if (!$("category").value && !$("items").querySelector(".it")) { $("items").innerHTML = ""; $("items").appendChild(el("div", t("choose_cat_first"), "hint")); }
  if (!$("st_cat").value && !$("st_items").querySelector(".it")) { $("st_items").innerHTML = ""; $("st_items").appendChild(el("div", t("choose_cat_first"), "hint")); }
  fillPay(); fillTypes(); renderFooter(); calcBuy();
  if ($("rds").options.length) fillRds(); else fillRds();
  CALS.forEach(c => { if (c.root.isConnected) c.refresh(); });
  if (!$("pub").hidden) tickClock();
  if (AUTH && !$("app").hidden) {
    $("who").textContent = (AUTH.name || AUTH.role) + " · " + AUTH.code;
    document.querySelectorAll(".uidline").forEach(x => { x.textContent = t("uid") + ": " + AUTH.code; });
    buildNav();
    if (SEC === "records") renderRecs(); else if (SEC === "items") renderMenuMgr(); else if (SEC === "users" && SUB === "list") renderUsers();
    else if (SEC === "settings") renderSettings(!!$("set_role").options.length);
    else if (!FORMS[SEC + "/" + SUB] && LASTREP && (SEC + "/" + SUB) in KINDS) { buildControls(); $("rt").textContent = titleFor(); $("rbrand").textContent = t("app") + " — " + titleFor(); drawReport(); }
  }
}
document.querySelectorAll(".lang").forEach(b => b.addEventListener("click", () => {
  lang = lang === "am" ? "en" : "am";
  localStorage.setItem("umh_lang", lang);
  applyLang();
}));

/* ===== ጅምር ===== */
applyLang();
if (AUTH && AUTH.token) {
  api("me").then(j => {
    if (!AUTH) return;
    if (j && j.ok) { Object.assign(AUTH, {kind: j.kind, role: j.role, name: j.name, perms: j.perms || {}}); localStorage.setItem("umh_auth", JSON.stringify(AUTH)); enterApp(); }
    else logout();
  }).catch(() => { if (AUTH) enterApp(); });
} else showPublic();
</script>
